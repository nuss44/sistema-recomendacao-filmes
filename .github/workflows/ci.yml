# Integração contínua: roda a cada push e pull request.
#
# - lint:  estilo e erros comuns (ruff)
# - tests: suíte completa em Linux e Windows, Python 3.10 e 3.12, com o Surprise
#
# Os testes com o MovieLens real (tests/test_real_data.py) são pulados aqui: a licença
# do dataset não permite redistribuí-lo. Já tests/test_metrics_report.py roda, pois só
# lê o reports/metrics.json versionado e o confere contra as tabelas do notebook.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar o pacote com as dependências de teste e o Surprise
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,surprise]"
      - name: Rodar os testes
        run: python -m pytest -v -rs --cov --cov-report=term-missing
