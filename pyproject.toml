[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recommender"
version = "0.4.0"
description = "Sistema de recomendação de filmes híbrido (SVD + conteúdo) treinado no MovieLens 1M"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vitor Andrade" }]
requires-python = ">=3.10"
# Versões exatas serão fixadas na etapa de dependências (requirements/lock).
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
# pytest 9.2.0 quebra no Windows com Python 3.10 (INTERNALERROR em NodeId)
dev = ["pytest>=8,<9.2", "pytest-cov>=5", "matplotlib>=3.7", "ruff>=0.6"]
# Comparação com o SVD do Surprise (a 1.1.5 tem instaladores prontos, inclusive para Windows)
surprise = ["scikit-surprise>=1.1.5"]
# Rodar o notebook de experimentos
experiments = ["scikit-surprise>=1.1.5", "matplotlib>=3.7", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["recommender"]

[tool.ruff]
line-length = 120
target-version = "py310"
# main.py e train_model.py são a versão antiga da API; saem quando a nova entrar.
extend-exclude = ["notebooks", "main.py", "train_model.py"]

[tool.ruff.lint]
# E/W: estilo · F: erros (nomes indefinidos, imports sem uso) · I: ordem dos imports
# B: armadilhas comuns · UP: sintaxe moderna · NPY: boas práticas do NumPy
select = ["E", "W", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Cópia literal das células do notebook: as linhas longas fazem parte do texto copiado.
"tests/notebook_reference.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["recommender"]
