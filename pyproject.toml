[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recommender"
version = "0.2.0"
description = "Sistema de recomendação de filmes híbrido (SVD + conteúdo) treinado no MovieLens 1M"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vitor Andrade" }]
requires-python = ">=3.10"
# Versões exatas serão fixadas na etapa de dependências (requirements/lock).
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
# pytest 9.2.0 quebra no Windows com Python 3.10 (INTERNALERROR em NodeId)
dev = ["pytest>=8,<9.2"]
# Só para reproduzir a comparação com o SVD do Surprise e rodar o notebook.
experiments = ["scikit-surprise>=1.1.3", "matplotlib>=3.7", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
